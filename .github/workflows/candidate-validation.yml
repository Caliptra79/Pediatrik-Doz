name: Candidate safety checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate research-only candidate records
        run: node tests/validate-candidates.cjs
      - name: Verify formulation conversions and combination ingredient isolation
        run: node tests/formulation-arithmetic.cjs
      - name: Guard existing active drug registry and isolate candidates
        run: node tests/active-registry-guard.cjs
      - name: Check research-only dose engine with synthetic fixtures
        run: node tests/reviewed-dose-core.cjs
